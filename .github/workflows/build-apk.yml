name: Compilar Oti IA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir Oti IA
        run: unzip -o OtiIA_Personal_Android_v0.2_APK_READY.zip

      - name: Corregir OtiSpeaker
        run: |
          sed -i 's/private final TextToSpeech tts;/private TextToSpeech tts;/' OtiIA_Personal_Android/app/src/main/java/com/azmovil/oti/OtiSpeaker.java

      - name: Compilar APK
        working-directory: OtiIA_Personal_Android
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: OtiIA-APK
          path: OtiIA_Personal_Android/app/build/outputs/apk/debug/app-debug.apk
