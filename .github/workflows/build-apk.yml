name: Compilar Oti IA Plus 1.0 Professional APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir Oti IA Plus 1.0
        run: unzip -o OtiIA_Plus_1.0_FULL.zip

      - name: Compilar APK
        working-directory: OtiIA_Plus_1.0_FULL
        run: gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: OtiIA-Plus-1.0-Professional-APK
          path: OtiIA_Plus_1.0_FULL/app/build/outputs/apk/debug/app-debug.apk
