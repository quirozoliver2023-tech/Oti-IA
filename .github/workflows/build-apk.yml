name: Compilar Oti IA Plus 1.0 Play Ready

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir Oti IA Plus Play Ready
        run: unzip -o OtiIA_Plus_1.0_PLAY_READY.zip

      - name: Compilar APK y AAB
        working-directory: OtiIA_Plus_1.0_PLAY_READY
        run: gradle :app:assembleDebug :app:bundleDebug

      - name: Guardar APK y AAB
        uses: actions/upload-artifact@v4
        with:
          name: OtiIA-Plus-1.0-Play-Ready
          path: |
            OtiIA_Plus_1.0_PLAY_READY/app/build/outputs/apk/debug/app-debug.apk
            OtiIA_Plus_1.0_PLAY_READY/app/build/outputs/bundle/debug/app-debug.aab
